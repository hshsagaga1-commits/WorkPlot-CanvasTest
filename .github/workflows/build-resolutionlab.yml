name: Build ResolutionLab Diagnostic

on:
  push:
    branches: [resolutionlab-diagnostic]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    name: Test and build iPhoneOS ARM64
    runs-on: macos-26
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Test report parsing, comparison and persistence
        run: |
          mkdir -p build/output
          swift test 2>&1 | tee build/output/tests.log
      - name: Build and package IPA
        run: bash scripts/build-ipa.sh build/output
      - name: Upload IPA and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ResolutionLab-Diagnostic
          path: build/output/
          if-no-files-found: error
          retention-days: 14
