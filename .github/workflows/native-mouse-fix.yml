name: Build NativeMouseFix V0
on:
  push:
    branches: [native-mouse-fix-v0]
    paths:
      - 'NativeMouseFix/**'
      - '.github/workflows/native-mouse-fix.yml'
  pull_request:
    branches: [main]
    paths:
      - 'NativeMouseFix/**'
      - '.github/workflows/native-mouse-fix.yml'
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build arm64 iOS dylib
        run: |
          cd NativeMouseFix
          chmod +x build.sh
          ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: NativeMouseFix-V0
          path: NativeMouseFix/NativeMouseFix.dylib
